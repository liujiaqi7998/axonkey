[package]
name = "axonkey-service"
version = "0.3.1"
edition = "2021"
rust-version = "1.98"
publish = false

[[bin]]
name = "AxonkeyService"
path = "src/main.rs"

[dependencies]
prost = "=0.13.5"
log = "=0.4.34"
windows = { version = "=0.61.3", features = [
  "Foundation", "Devices_Bluetooth_GenericAttributeProfile", "Devices_Enumeration",
  "Storage_Streams", "Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO",
  "Win32_System_Services", "Win32_System_Threading", "Win32_System_WinRT",
  "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_Diagnostics_Debug",
  "Win32_System_Time", "Win32_System_SystemInformation", "Win32_System_SystemServices",
] }
windows-future = { version = "=0.2.1", features = ["std"] }
tokio = { version = "=1.53.2", features = ["rt", "net", "time", "io-util", "sync", "macros"] }
winreg = "=0.55.0"

[dev-dependencies]
sha2 = "=0.10.9"

[build-dependencies]
prost-build = "=0.13.5"
protoc-bin-vendored = "=3.3.0"
cc = "=1.6.0"

[profile.release]
debug = 2
panic = "unwind"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
